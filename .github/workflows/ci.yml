name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # `cache: pnpm` requires pnpm to already be on PATH, so this must come
      # after the step above.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      # `pnpm check` covers src/ only — tsconfig.json excludes *.test.ts and
      # SvelteKit's inherited `include` never listed ../scripts/**. The
      # generators under scripts/ produce COMMITTED artifacts (theme-colors.ts,
      # theme-meta.ts, themes/README.md), so an error there fails on the next
      # contributor's machine rather than in CI. See peep-sg1.
      - name: Typecheck scripts
        run: pnpm check:scripts

      - name: Test
        run: pnpm test

  # The sanitizer harness is the ONLY verification that touches the real
  # cascade. jsdom supports neither @layer nor var(), so vitest structurally
  # cannot assert containment — three real bugs shipped green under vitest and
  # were caught only here. It runs in its own job rather than inside `frontend`
  # so a Playwright browser download never gates the fast typecheck/test loop.
  #
  # Chromium + WebKit, because the sanitizer's CSSOM rebuild has already been
  # measured to diverge between them (setProperty with an empty priority is a
  # no-op for custom properties in WebKit only).
  sanitizer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium webkit

      - name: Sanitizer containment (Chromium + WebKit)
        run: pnpm test:sanitizer

  # Playwright's WebKit is a WebKitGTK build, NOT the WKWebView this app
  # actually ships on macOS. It shares WebCore, so it catches CSSOM-level
  # regressions — but not platform-layer behaviour such as elementFromPoint
  # hit-testing, which is exactly what the overlay/clickjack attacks assert.
  # macOS is the primary platform, so it gets its own run on a real Apple
  # WebKit build. Separate from the `rust` matrix deliberately: this must not
  # queue behind a full cargo compile to report a CSS containment failure.
  sanitizer-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps webkit

      - name: Sanitizer containment (WebKit)
        run: pnpm test:sanitizer --engine webkit

  rust:
    # Builds on every platform we ship. The macOS-only `default_viewer` module
    # and its CoreServices FFI have never been compiled for Windows or Linux,
    # so this job is what proves the cfg gating is correct — before a release
    # tag rather than after one leaves a half-populated draft behind.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      # The frontend build output must exist because tauri.conf.json points
      # `frontendDist` at ../build, and the Rust build validates it.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Cargo.toml sets clippy pedantic + nursery to warn; -D promotes them to
      # errors so drift cannot accumulate.
      - name: Clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
