name: release

# Tag push is the trigger: the tag is an immutable record of exactly what
# shipped. `release: published` would be backwards, since tauri-action's job is
# to *create* the release. workflow_dispatch is here only to re-run a single
# failed platform without inventing a throwaway tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    strategy:
      # All three jobs write into one release. If one platform fails, let the
      # others finish rather than leaving the manifest partially written.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'
          # Not ubuntu-latest: glibc is forward-incompatible, so an AppImage
          # built on 24.04 will not run on 22.04.
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Must follow pnpm setup: `cache: pnpm` needs pnpm on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Fail loudly if the tag and package.json disagree. tauri.conf.json
      # inherits its version from package.json and is what the updater compares
      # against the manifest, so a mismatch would ship an update that clients
      # either never see or immediately re-offer.
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "${TAG_NAME#v}" != "$pkg_version" ]; then
            echo "Tag ${TAG_NAME} does not match package.json version ${pkg_version}" >&2
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing and notarization are deliberately NOT listed here.
          #
          # The bundler gates on `var_os("APPLE_CERTIFICATE").is_some()`
          # (tauri-bundler/src/bundle/macos/sign.rs), and a GitHub secret that
          # does not exist still expands to an empty string -- which is
          # `Some("")`, not `None`. Listing the vars unconditionally therefore
          # requests signing and then fails importing a zero-byte certificate:
          # `failed to import keychain certificate`. An empty-string fallback
          # does not help for the same reason.
          #
          # Omitting them entirely lets the bundler ad-hoc sign, which is what
          # an un-notarized build wants. To notarize: add the secrets, then
          # re-add these six lines pointing at them.
        with:
          # Always pass tagName so asset URLs are pinned to this version
          # rather than /releases/latest/download/ paths.
          tagName: ${{ github.ref_name }}
          releaseName: 'peep __VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          # Draft until you publish: users never see a half-populated release,
          # and latest.json is unreachable at /releases/latest/download/ until
          # all three platforms have uploaded.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Disabled because the three matrix jobs race: each one downloads
          # latest.json, adds its own platform, and re-uploads. Whoever
          # finishes last wins, so the manifest ends up describing one or two
          # platforms instead of three -- and a missing platform key means
          # those clients silently see no update at all. The `manifest` job
          # below rebuilds it once, after every platform has uploaded.
          uploadUpdaterJson: false

  # Single writer for latest.json, so there is no race to lose.
  manifest:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Build latest.json from the uploaded signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          # --repo on every call: this job deliberately skips actions/checkout
          # (it needs no source), so there is no git remote for gh to infer
          # the repository from.
          gh release download "$TAG_NAME" --repo "$REPO" -p '*.sig' -D sigs --clobber
          # Names only. A draft's API asset URLs point at an `untagged-<hash>`
          # path that stops resolving once the release is published, so the
          # manifest must use the permanent /releases/download/<tag>/ form.
          # Names are stable; those URLs are not.
          gh release view "$TAG_NAME" --repo "$REPO" --json assets \
            --jq '.assets[].name' > assets.txt

          python3 - "$version" "$TAG_NAME" "$REPO" <<'PY'
          import json, os, sys

          version, tag, repo = sys.argv[1], sys.argv[2], sys.argv[3]
          names = {line.strip() for line in open("assets.txt") if line.strip()}
          base = f"https://github.com/{repo}/releases/download/{tag}"

          # Map each signature file to its updater platform key. Only bundle
          # types the updater can actually install belong here.
          suffixes = {
              ".app.tar.gz.sig": "darwin-aarch64",
              ".AppImage.sig": "linux-x86_64",
              "-setup.exe.sig": "windows-x86_64",
          }

          platforms = {}
          for sig_name in sorted(os.listdir("sigs")):
              for suffix, key in suffixes.items():
                  if sig_name.endswith(suffix):
                      artifact = sig_name[:-4]  # drop ".sig"
                      if artifact not in names:
                          sys.exit(f"no uploaded asset matching {artifact}")
                      platforms[key] = {
                          "signature": open(f"sigs/{sig_name}").read().strip(),
                          "url": f"{base}/{artifact}",
                      }
                      break

          missing = set(suffixes.values()) - platforms.keys()
          if missing:
              # Fail loudly: a silently absent key strands that platform's
              # users on their current version forever.
              sys.exit(f"latest.json is missing platforms: {sorted(missing)}")

          json.dump({
              "version": version,
              "notes": f"See the assets below to download and install this version.",
              "platforms": platforms,
          }, open("latest.json", "w"), indent=2)
          print(f"latest.json covers: {sorted(platforms)}")
          PY

          gh release upload "$TAG_NAME" --repo "$REPO" latest.json --clobber
